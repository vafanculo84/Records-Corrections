name: records-correction-base44

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: records_correction
      POSTGRES_USER: records
      POSTGRES_PASSWORD: records
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U records -d records_correction"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - base44_postgres_data:/var/lib/postgresql/data

  setup:
    image: node:22-bookworm
    working_dir: /workspace
    init: true
    env_file:
      - .env.base44-defaults
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/workspace
      - base44_node_modules:/workspace/node_modules
      - base44_pnpm_store:/pnpm/store
    command:
      - sh
      - -c
      - |
        corepack enable
        pnpm config set store-dir /pnpm/store
        pnpm install --frozen-lockfile
        pnpm db:generate
        pnpm exec prisma migrate deploy
        pnpm db:seed
    restart: "no"

  app:
    image: node:22-bookworm
    working_dir: /workspace
    init: true
    env_file:
      - .env.base44-defaults
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - base44_node_modules:/workspace/node_modules
      - base44_pnpm_store:/pnpm/store
    command:
      - sh
      - -c
      - |
        corepack enable
        pnpm config set store-dir /pnpm/store
        pnpm dev --hostname 0.0.0.0

volumes:
  base44_postgres_data:
  base44_node_modules:
  base44_pnpm_store:
