services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: records_correction
      POSTGRES_USER: records
      POSTGRES_PASSWORD: records
    ports:
      - "5432:5432"
    volumes:
      - records_correction_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U records -d records_correction"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  records_correction_pgdata:
